apiVersion: apps/v1
kind: Deployment
metadata:
  name: weathergpt-api
  namespace: weathergpt-dev
spec:
  replicas: 2
  selector:
    matchLabels: {app: weathergpt-api}
  template:
    metadata:
      labels: {app: weathergpt-api}
    spec:
      containers:
      - name: api
        image: weathergpt/api:local
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8000}]
        env:
        - name: CORS_ORIGINS
          value: "*"
        readinessProbe:
          httpGet: {path: /health, port: 8000}
        livenessProbe:
          httpGet: {path: /health, port: 8000}
---
apiVersion: v1
kind: Service
metadata:
  name: weathergpt-api
  namespace: weathergpt-dev
spec:
  selector: {app: weathergpt-api}
  ports: [{port: 8000, targetPort: 8000}]
